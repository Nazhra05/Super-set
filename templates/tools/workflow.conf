# Workflow config, sourced by tools/wt.sh and tools/guard.sh. Bash syntax, LF line endings.

# One repo per line: alias|path relative to the project root|working branch.
# Single-repo project: one line with path "." (worktrees then live in <root>/_wt, which is gitignored).
# Multi-repo project (docs root + app repos): one line per app repo.
REPOS='
{{REPOS}}
'

# Files copied by name (never read or printed) from the repo into each new worktree.
COPY_FILES='.env .env.local'

# Dependency install run inside a new worktree, e.g. 'npm ci --no-audit --no-fund'. Empty skips it.
INSTALL_CMD='{{INSTALL_CMD}}'

# guard.sh patterns (POSIX extended regex): test file paths, skip/focus markers, assertion lines.
# Defaults are proven on Jest, Vitest, and Playwright tests (JS/TS), plus the PHPUnit skip marker.
# For another test framework, extend them at setup and prove each new pattern with a guard run that must fail.
TEST_PATH_RE='(\.test\.|\.spec\.|/tests?/|/e2e/)'
SKIP_RE='(\.skip\(|\.only\(|(^|[^[:alnum:]_])xit\(|(^|[^[:alnum:]_])xdescribe\(|\.todo\(|markTestSkipped)'
ASSERT_RE='expect\('
