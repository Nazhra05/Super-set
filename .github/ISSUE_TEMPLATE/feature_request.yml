name: Feature request
description: Suggest a new rule, check, document, or improvement.
labels: ["enhancement"]
body:
  - type: dropdown
    id: plugin
    attributes:
      label: Plugin
      options:
        - app-project-workflow (Claude Code)
        - content-project-workflow (Claude Code)
        - agy-app-project-workflow (Google Antigravity)
        - agy-content-project-workflow (Google Antigravity)
        - codex-app-project-workflow (OpenAI Codex)
        - codex-content-project-workflow (OpenAI Codex)
        - All plugins or the repository
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What went wrong without it
      description: Every rule in these plugins exists because of a real problem. Describe yours.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would prevent it
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Other options you considered
